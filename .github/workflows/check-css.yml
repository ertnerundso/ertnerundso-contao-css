name: Check modular CSS

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'site.css'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-css.yml'
  pull_request:
    paths:
      - 'css/**'
      - 'site.css'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-css.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:css
