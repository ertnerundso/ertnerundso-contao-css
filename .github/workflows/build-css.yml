name: Build modular CSS

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'site.css'
      - 'scripts/build-css.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-css.yml'
  pull_request:
    paths:
      - 'css/**'
      - 'site.css'
      - 'scripts/build-css.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-css.yml'
  workflow_dispatch:

# Serialize publication with the JavaScript build to avoid concurrent pushes.
concurrency:
  group: frontend-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:css

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run check:css
      - name: Publish combined stylesheet
        run: |
          git add site.css
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build modular CSS"
          git push
