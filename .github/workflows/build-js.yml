name: Build frontend JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'src/site.js'
      - 'src/scene.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-js.yml'
  workflow_dispatch:

concurrency:
  group: frontend-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - name: Publish JavaScript without changing CSS
        run: |
          git add dist/site.js dist/chunks/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build frontend JavaScript"
          git push
